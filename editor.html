<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMED SEO Editor</title><link rel="stylesheet" href="editor.css"></head><body>
<main class="app"><section class="editor"><h1>TEMED SEO Editor</h1><div id="save_result" class="card">Готово к работе</div>
<section class="card"><h2>Проверка результата</h2><div class="actions"><button id="check_internal">Проверить по статьям TEMED</button><button id="check_external">Проверить в интернете</button><button id="check_all">Проверить всё</button></div><div id="internal_uniqueness_card" class="uniqueness-card"><h3>Внутренняя уникальность TEMED</h3><div class="status">not_started</div><div class="body"></div></div><div id="external_uniqueness_card" class="uniqueness-card"><h3>Внешняя уникальность TEXT.RU</h3><div class="status">not_started</div><div class="body"></div></div></section>
<section class="card"><h2>XML</h2><button id="download_xml_btn">Скачать XML для инфоблока 81</button></section>
</section><aside id="assistant_panel" class="assistant-panel"><button id="assistant_toggle" class="assistant-toggle">ИИ-ассистент</button><div class="assistant-content"><div class="assistant-head"><h2>ИИ-ассистент</h2><select id="assistant_mode"><option value="article">Помощь со статьёй</option><option value="system">Помощь по системе</option></select><button id="assistant_clear">Очистить</button></div><div id="assistant_messages" class="assistant-messages"></div><textarea id="assistant_input" maxlength="10000" placeholder="Задайте вопрос"></textarea><button id="assistant_send">Отправить</button></div></aside></main><script src="editor.js"></script></body></html>
